name: End-to-End

on:
  pull_request:
    paths:
      - install_test_visibility.sh
      - tests/e2e/**
      - .github/workflows/e2e.yml
  push:
    branches:
      - main
      - codex/**
    paths:
      - install_test_visibility.sh
      - tests/e2e/**
      - .github/workflows/e2e.yml
  workflow_dispatch:

jobs:
  e2e:
    name: e2e ${{ matrix.language }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        language:
          - go
          - python
          - js
          - java
          - dotnet
          - ruby
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache: false

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        if: matrix.language == 'js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The runner images already have Maven.
      - name: Set up Java
        if: matrix.language == 'java'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET
        if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Set up Ruby
        if: matrix.language == 'ruby'
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'

      - name: Verify shell syntax
        run: |
          bash -n install_test_visibility.sh
          bash -n tests/e2e/run.sh

      # First, before the GitHub mode changes the job's environment: the
      # installer's output exported in one shell, as the README, the GitLab
      # script and the CircleCI orb consume it.
      - name: Install and run tests in one shell
        run: tests/e2e/run.sh ${{ matrix.language }} shell

      # Then as the GitHub action consumes it: the output goes to GITHUB_ENV,
      # and the tests run in the next step. This runs even when the shell mode
      # failed, which still fails the job, so both consumers are checked.
      - name: Install as the GitHub action does
        id: github-install
        if: ${{ !cancelled() }}
        run: tests/e2e/run.sh ${{ matrix.language }} github-install

      - name: Run tests in the next step
        if: ${{ !cancelled() && steps.github-install.outcome == 'success' }}
        run: tests/e2e/run.sh ${{ matrix.language }} github-test

      # Steps in any shell, not only Bash, must find ddtest's go first.
      - name: Find ddtest's go from PowerShell
        if: ${{ !cancelled() && matrix.language == 'go' && steps.github-install.outcome == 'success' }}
        shell: pwsh
        run: |
          $go = (Get-Command go).Source
          Write-Output "go: $go"
          if ($go -notlike '*go-shim*') { throw "go is $go, not ddtest's go command" }
          go env GOVERSION

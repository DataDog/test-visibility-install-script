name: Python Test Matrix

on:
  pull_request:
    paths:
      - install_test_visibility.sh
      - tests/*python*
      - .github/workflows/python-test-matrix.yml
  push:
    branches: [main]
    paths:
      - install_test_visibility.sh
      - tests/*python*
      - .github/workflows/python-test-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check shell syntax and deterministic failure scenarios
        run: |
          bash -n install_test_visibility.sh tests/run_python_smoke.sh
          python -m unittest discover -s tests -p test_python_install.py -v
      - name: Install packages and verify instrumented pytest with coverage
        run: tests/run_python_smoke.sh

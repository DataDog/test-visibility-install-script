name: Python Test Matrix

on:
  pull_request:
    paths:
      - install_test_visibility.sh
      - tests/run_python_matrix.sh
      - tests/run_python_smoke.sh
      - .github/workflows/python-test-matrix.yml
  push:
    branches:
      - main
      - codex/**
    paths:
      - install_test_visibility.sh
      - tests/run_python_matrix.sh
      - tests/run_python_smoke.sh
      - .github/workflows/python-test-matrix.yml
  workflow_dispatch:

jobs:
  python-test-matrix:
    name: python matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify shell syntax
        run: |
          bash -n install_test_visibility.sh
          bash -n tests/run_python_matrix.sh
          /bin/bash -n tests/run_python_matrix.sh

      - name: Run Python test matrix
        run: tests/run_python_matrix.sh

  python-smoke:
    name: python smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify shell syntax
        run: |
          bash -n install_test_visibility.sh
          bash -n tests/run_python_smoke.sh
          /bin/bash -n tests/run_python_smoke.sh

      # Real-network smoke test: installs ddtrace from PyPI and verifies that
      # instrumented pytest works without the coverage package.
      - name: Run Python smoke test
        run: tests/run_python_smoke.sh python
